<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Condition JS </title>
</head>
<body style="background-color: #212121;">
    <p id="demo"></p>
    <p id="demo2"></p>
</body>
<script>
    // code for for loop 
    const car = ["car1","car2","car3"]
    let len = car.length;
    let text = ""
    for(let i =0 ;i<len;i++){
        // document.write(car[i]);
        // console.log(car[i]);
        if(i==1){
            continue;
        }
        text +=car[i]+"<br>";
    }
    document.getElementById("demo").innerHTML = text ;
</script>
<script>
    // code for while loop
    let i =1;
    let text2 =" "
    while(i<=5){
        document.write(" <br> hello");
        i++
    }
    document.getElementById("demo2").innerHTML = text2;
</script>
</html>
